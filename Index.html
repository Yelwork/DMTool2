<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG 戰役助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { 'campaign-dark': '#2c3e50', 'excel-bg': '#e5dfd3', 'excel-border': '#1a1a1a' } } } }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f1ea; }
        .tab-content { display: none; } .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .bg-str { background-color: #ffcccc; } .bg-dex { background-color: #cce5ff; }
        .bg-con { background-color: #ffddcc; } .bg-int { background-color: #ccffcc; }
        .bg-wis { background-color: #ffe5cc; } .bg-cha { background-color: #e5ccff; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">
    <header class="bg-campaign-dark text-white shadow-md z-10 flex-shrink-0">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider"><i class="fa-solid fa-dragon mr-2"></i>戰役助手：礦坑 & 冰塔峰</h1>
        </div>
        <nav class="container mx-auto px-2 flex space-x-1 overflow-x-auto custom-scrollbar pb-1">
            <button onclick="switchTab('tab-story')" class="tab-btn bg-gray-700 text-gray-300 px-4 py-2 rounded-t-lg whitespace-nowrap"><i class="fa-solid fa-clipboard-list mr-2"></i>任務板</button>
            <button onclick="switchTab('tab-locations')" class="tab-btn bg-gray-700 text-gray-300 px-4 py-2 rounded-t-lg whitespace-nowrap"><i class="fa-solid fa-map-pin mr-2"></i>地點與NPC</button>
            <button onclick="switchTab('tab-tools')" class="tab-btn active bg-white text-campaign-dark px-4 py-2 rounded-t-lg font-bold whitespace-nowrap"><i class="fa-solid fa-dice-d20 mr-2"></i>DM 工具</button>
            <button onclick="switchTab('tab-players')" class="tab-btn bg-gray-700 text-gray-300 px-4 py-2 rounded-t-lg whitespace-nowrap"><i class="fa-solid fa-id-card mr-2"></i>玩家面板</button>
        </nav>
    </header>

    <main class="flex-grow overflow-y-auto custom-scrollbar p-4 relative" id="main-content">
        <!-- 任務板 -->
        <div id="tab-story" class="tab-content max-w-[1400px] mx-auto space-y-4">
            <div class="flex gap-2 flex-wrap mb-2 bg-white p-3 rounded-xl shadow-sm border items-center justify-between">
                <div class="flex gap-2 flex-wrap">
                    <button onclick="renderQuests('All')" class="quest-btn px-3 py-1 bg-green-600 text-white rounded text-sm font-bold shadow-sm transition">全部</button>
                    <button onclick="renderQuests('Main')" class="quest-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold shadow-sm transition">礦坑主線</button>
                    <button onclick="renderQuests('Side')" class="quest-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold shadow-sm transition">礦坑支線</button>
                    <button onclick="renderQuests('DoIP')" class="quest-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold shadow-sm transition">冰塔峰擴充</button>
                </div>
                <input type="text" id="quest-search" placeholder="搜尋任務..." class="px-3 py-1.5 border rounded text-sm outline-none focus:ring-2 w-full sm:w-auto" onkeyup="renderQuests()">
            </div>
            <div id="quests-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pb-10"></div>
        </div>

        <!-- 地點與 NPC -->
        <div id="tab-locations" class="tab-content max-w-6xl mx-auto">
            <div class="mb-4 flex gap-2">
                <input type="text" id="loc-search" placeholder="搜尋地點或 NPC..." class="w-full md:w-1/3 px-3 py-1.5 border rounded-full text-sm shadow-inner outline-none focus:ring-2 focus:ring-blue-400" onkeyup="renderLocs()">
            </div>
            <div id="locations-container" class="space-y-6 pb-10"></div>
        </div>

        <!-- DM 工具 -->
        <div id="tab-tools" class="tab-content active max-w-6xl mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start pb-10">
                <!-- 法術庫速查 -->
                <div class="bg-white p-5 rounded-xl shadow border lg:col-span-2">
                    <h3 class="text-xl font-bold mb-3 border-b pb-2 flex justify-between items-center"><span class="text-campaign-dark"><i class="fa-solid fa-wand-magic-sparkles mr-2 text-purple-600"></i>法術庫速查 (0~9環)</span></h3>
                    <div class="flex flex-wrap gap-2 mb-4 items-center bg-purple-50 p-2 rounded border border-purple-100">
                        <button onclick="renderSpells('All')" class="spell-btn px-3 py-1 bg-purple-600 text-white rounded text-sm font-bold">全部</button>
                        <button onclick="renderSpells(0)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">戲法</button>
                        <button onclick="renderSpells(1)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">1環</button>
                        <button onclick="renderSpells(2)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">2環</button>
                        <button onclick="renderSpells(3)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">3環</button>
                        <button onclick="renderSpells(4)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">4環</button>
                        <button onclick="renderSpells(5)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">5環</button>
                        <button onclick="renderSpells(6)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">6環</button>
                        <button onclick="renderSpells(7)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">7環</button>
                        <button onclick="renderSpells(8)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">8環</button>
                        <button onclick="renderSpells(9)" class="spell-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">9環</button>
                        <input type="text" id="spell-search" placeholder="搜尋法術..." class="px-3 py-1 border rounded text-sm ml-auto outline-none w-full md:w-48 mt-2 md:mt-0" onkeyup="renderSpells()">
                    </div>
                    <div class="overflow-x-auto max-h-[300px] border rounded custom-scrollbar shadow-inner"><table class="w-full text-sm text-left"><thead class="bg-gray-800 text-white sticky top-0 z-10"><tr><th class="px-3 py-2">名稱</th><th class="px-2 py-2 text-center">環</th><th class="px-2 py-2 text-center">距離</th><th class="px-2 py-2 text-center">成分</th><th class="px-3 py-2 w-1/3">效果描述</th><th class="px-3 py-2 text-red-300">傷害/效果</th></tr></thead><tbody id="spell-table-body" class="bg-white divide-y"></tbody></table></div>
                </div>

                <!-- 萬物商店速查 -->
                <div class="bg-white p-5 rounded-xl shadow border lg:col-span-2">
                    <h3 class="text-xl font-bold mb-3 border-b pb-2"><i class="fa-solid fa-store mr-2 text-blue-600"></i>萬物商店速查</h3>
                    <div class="flex flex-wrap gap-2 mb-4 items-center bg-gray-50 p-2 rounded border">
                        <button onclick="renderStore('All')" class="store-btn px-3 py-1 bg-blue-600 text-white rounded text-sm font-bold">全部</button>
                        <button onclick="renderStore('Gear')" class="store-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">裝備</button>
                        <button onclick="renderStore('Weapon')" class="store-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">武器</button>
                        <button onclick="renderStore('Armor')" class="store-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">防具</button>
                        <button onclick="renderStore('Magic')" class="store-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">魔法/藥水</button>
                        <button onclick="renderStore('Tool')" class="store-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">工具</button>
                        <button onclick="renderStore('Mounts/Vehicles')" class="store-btn px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm font-bold">坐騎/載具</button>
                        <input type="text" id="store-search" placeholder="搜尋物品..." class="px-3 py-1 border rounded text-sm ml-auto outline-none w-full md:w-48 mt-2 md:mt-0" onkeyup="renderStore()">
                    </div>
                    <div class="overflow-x-auto max-h-[300px] border rounded custom-scrollbar shadow-inner"><table class="w-full text-sm text-left"><thead class="bg-gray-800 text-white sticky top-0 z-10"><tr><th class="px-3 py-2">物品名稱</th><th class="px-3 py-2 text-yellow-400">價格</th><th class="px-2 py-2 text-center text-xs">村莊</th><th class="px-2 py-2 text-center text-xs">城鎮</th><th class="px-2 py-2 text-center text-xs">城市</th><th class="px-3 py-2 text-xs text-gray-400">分類</th></tr></thead><tbody id="store-table-body" class="bg-white divide-y"></tbody></table></div>
                </div>

                <!-- 戰鬥先攻助手 -->
                <div class="bg-white p-5 rounded-xl shadow border flex flex-col min-h-[28rem]">
                    <h3 class="text-lg font-bold mb-3 border-b pb-2 flex justify-between"><span><i class="fa-solid fa-swords mr-2 text-red-600"></i>戰鬥先攻助手</span><button onclick="cmbs=[];renderCmb();" class="text-xs bg-red-100 text-red-700 px-2 rounded hover:bg-red-200 font-bold transition">清空</button></h3>
                    <div class="flex gap-1 mb-4 bg-gray-50 p-2 rounded border">
                        <input type="number" id="c-init" placeholder="先攻" class="w-1/6 px-1 border rounded text-center font-bold outline-none focus:border-blue-500">
                        <input type="text" id="c-name" placeholder="名稱" class="w-1/3 px-2 border rounded font-bold outline-none focus:border-blue-500">
                        <input type="number" id="c-ac" placeholder="AC" class="w-1/6 px-1 border rounded text-center text-blue-800 font-bold outline-none">
                        <input type="number" id="c-hp" placeholder="HP" class="w-1/6 px-1 border rounded text-center text-red-600 font-bold outline-none">
                        <select id="c-fac" class="w-1/6 px-1 border rounded text-xs outline-none font-bold"><option value="e">敵方</option><option value="p">友方</option></select>
                        <button onclick="addCmb()" class="bg-green-600 text-white px-3 py-1.5 rounded font-black hover:bg-green-700">+</button>
                    </div>
                    <div class="text-[11px] text-gray-400 mb-2 border-b pb-1">💡 點擊數字可修改，修改先攻會自動重新排序。</div>
                    <div class="flex-grow overflow-y-auto custom-scrollbar space-y-2 h-64 pr-1" id="combat-list"></div>
                </div>
                
                <div class="flex flex-col gap-6">
                    <!-- 地下擂台 -->
                    <div class="bg-white p-5 rounded-xl shadow border">
                        <h3 class="text-lg font-bold mb-3 border-b pb-2 flex justify-between"><span><i class="fa-solid fa-gavel mr-2 text-red-600"></i>地下擂台 (小遊戲)</span><button onclick="genOdds()" class="text-xs bg-yellow-100 text-yellow-800 px-3 rounded hover:bg-yellow-200 font-bold">重新開盤</button></h3>
                        <div class="flex gap-2 items-center mb-3 bg-red-50 p-3 rounded border border-red-100">
                            <div class="w-[42%] text-center"><input id="ar-a" value="紅方猛獸" class="w-full border-red-300 rounded p-1.5 text-sm font-bold text-red-700 text-center outline-none shadow-sm"><div id="od-a" class="text-xs mt-1 font-black bg-white rounded border py-1 shadow-inner"></div></div>
                            <div class="w-[16%] text-center font-black text-gray-400 text-xs flex flex-col items-center justify-center">VS<div id="od-d" class="text-[10px] text-white bg-purple-700 rounded border border-purple-900 py-1 mt-1 w-full shadow-sm"></div></div>
                            <div class="w-[42%] text-center"><input id="ar-b" value="藍方快手" class="w-full border-blue-300 rounded p-1.5 text-sm font-bold text-blue-700 text-center outline-none shadow-sm"><div id="od-b" class="text-xs mt-1 font-black bg-white rounded border py-1 shadow-inner"></div></div>
                        </div>
                        <div id="arena-bets" class="space-y-1.5 mt-2 border-t pt-2"></div>
                        <button onclick="rollArena()" class="bg-gradient-to-r from-red-700 to-red-900 text-white px-4 py-2 rounded font-bold w-full mt-3 shadow hover:from-red-800 hover:to-black">⚔️ 模擬結算 (戰鬥三次)</button>
                        <div id="arena-result" class="p-3 bg-white rounded border mt-2 min-h-[90px] text-sm text-center text-gray-400 shadow-inner">點擊重新開盤...</div>
                    </div>

                    <!-- 酒館大口喝麥酒 -->
                    <div class="bg-white p-5 rounded-xl shadow border">
                        <h3 class="text-lg font-bold mb-2 border-b pb-2 flex justify-between"><span><i class="fa-solid fa-beer-mug-empty mr-2 text-yellow-600"></i>酒館：大口喝麥酒</span><button onclick="document.getElementById('drink-rules').classList.toggle('hidden')" class="text-xs bg-gray-100 text-gray-700 px-2 py-1 rounded border hover:bg-gray-200 font-bold">優劣勢參考</button></h3>
                        <div id="drink-rules" class="hidden mb-3 text-xs bg-gray-50 border rounded p-2"><table class="w-full text-left"><tbody><tr><td class="p-1 text-gray-600">矮人、解毒劑</td><td class="p-1 text-green-600 font-bold">優勢</td></tr><tr><td class="p-1 text-gray-600">隊友『巧手』偷倒酒</td><td class="p-1 text-green-600 font-bold">優勢 / DC-5</td></tr><tr><td class="p-1 text-gray-600">疲勞、空腹</td><td class="p-1 text-red-600 font-bold">劣勢</td></tr><tr><td class="p-1 text-gray-600">連兩次失敗發酒瘋</td><td class="p-1 text-red-600 font-bold">後續劣勢</td></tr></tbody></table></div>
                        <div class="flex flex-col gap-3 mb-2">
                            <div class="flex items-center gap-2 bg-yellow-50 p-2 rounded border border-yellow-200"><label class="text-sm font-bold text-yellow-800">當前杯數:</label><span id="drink-round" class="text-xl font-black text-yellow-600 w-8 text-center">1</span><span class="text-sm text-gray-500">(DC: <span id="drink-dc" class="font-bold text-red-600">10</span>)</span><div class="flex-grow"></div><button onclick="resetDrinking()" class="text-xs bg-gray-200 px-2 py-1 rounded font-bold text-gray-700 hover:bg-gray-300">重置</button></div>
                            <div class="flex items-center gap-2"><label class="text-sm font-bold w-16">體質加值:</label><input type="number" id="drink-con-mod" value="2" class="border rounded p-1.5 w-16 text-center text-sm font-bold outline-none"><label class="flex items-center gap-1 text-xs font-bold text-green-700 cursor-pointer ml-2 bg-green-50 px-2 py-1 rounded border border-green-200"><input type="checkbox" id="drink-adv" class="w-4 h-4">優勢</label><label class="flex items-center gap-1 text-xs font-bold text-red-700 cursor-pointer ml-1 bg-red-50 px-2 py-1 rounded border border-red-200"><input type="checkbox" id="drink-dis" class="w-4 h-4">劣勢</label></div>
                            <button onclick="rollDrinking()" id="btn-drink" class="bg-yellow-500 text-white px-4 py-2 rounded font-black shadow-md hover:bg-yellow-600 text-lg w-full">喝下一杯！</button>
                        </div>
                        <div id="drink-res" class="p-3 bg-gray-50 rounded border min-h-[70px] text-center text-sm flex flex-col justify-center items-center text-gray-400 shadow-inner">準備挑戰體質檢定...</div>
                    </div>
                    
                    <!-- 擲骰器 -->
                    <div class="bg-white p-5 rounded-xl shadow border">
                        <h3 class="text-lg font-bold mb-3 border-b pb-2"><i class="fa-solid fa-dice mr-2 text-purple-600"></i>通用擲骰器</h3>
                        <div class="flex flex-wrap gap-2 mb-2">
                            <button onclick="rDice(4)" class="px-3 py-1 bg-gray-100 rounded font-bold border hover:bg-gray-200">D4</button>
                            <button onclick="rDice(6)" class="px-3 py-1 bg-gray-100 rounded font-bold border hover:bg-gray-200">D6</button>
                            <button onclick="rDice(8)" class="px-3 py-1 bg-gray-100 rounded font-bold border hover:bg-gray-200">D8</button>
                            <button onclick="rDice(10)" class="px-3 py-1 bg-gray-100 rounded font-bold border hover:bg-gray-200">D10</button>
                            <button onclick="rDice(12)" class="px-3 py-1 bg-gray-100 rounded font-bold border hover:bg-gray-200">D12</button>
                            <button onclick="rDice(20)" class="px-3 py-1 bg-purple-100 text-purple-800 rounded font-bold border border-purple-300 hover:bg-purple-200">D20</button>
                            <button onclick="rDice(100)" class="px-3 py-1 bg-gray-100 rounded font-bold border hover:bg-gray-200">D100</button>
                        </div>
                        <div id="dice-res" class="text-3xl font-black text-center mb-1 h-10 flex items-center justify-center text-gray-800"></div>
                        <div id="dice-hist" class="h-24 overflow-y-auto bg-gray-50 border rounded p-2 text-xs custom-scrollbar"></div>
                    </div>

                    <!-- 礦坑與釣魚合體區 -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-white p-4 rounded-xl shadow border">
                            <h3 class="text-base font-bold mb-2 border-b pb-1"><i class="fa-solid fa-pickaxe mr-1 text-gray-600"></i>礦坑模擬</h3>
                            <select id="mine-tool" class="border rounded p-1.5 text-xs w-full mb-2 outline-none"><option value="0">生鏽舊鐵鎬</option><option value="2">精鋼鎬 (+2)</option><option value="3">魔法輕鎬 (+3)</option><option value="adv">傳奇之鎬 (優勢)</option></select>
                            <div class="flex gap-1 mb-2"><input type="number" id="mine-mod" value="0" class="border rounded p-1 w-full text-center text-xs" placeholder="加值"><button onclick="rollMining()" class="bg-gray-800 text-white px-3 py-1 rounded font-bold text-xs hover:bg-gray-700 w-full">揮鎬</button></div>
                            <div id="mine-res" class="p-2 bg-gray-50 rounded border min-h-[50px] text-center text-[11px] flex flex-col justify-center items-center text-gray-400">點擊開挖...</div>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow border">
                            <h3 class="text-base font-bold mb-2 border-b pb-1"><i class="fa-solid fa-fishing-rod mr-1 text-blue-600"></i>野外垂釣</h3>
                            <select id="fish-tool" class="border rounded p-1.5 text-xs w-full mb-2 outline-none"><option value="0">木製釣竿</option><option value="1">鐵線魚鉤 (+1)</option><option value="2">夜光蟲 (+2)</option><option value="3">破浪者 (+3)</option></select>
                            <div class="flex gap-1 mb-2"><input type="number" id="fish-mod" value="0" class="border rounded p-1 w-full text-center text-xs" placeholder="加值"><button onclick="rollFishing()" class="bg-blue-600 text-white px-3 py-1 rounded font-bold text-xs hover:bg-blue-700 w-full">甩竿</button></div>
                            <div id="fish-res" class="p-2 bg-blue-50 rounded border min-h-[50px] text-center text-[11px] flex flex-col justify-center items-center text-blue-400">點擊甩竿...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 玩家面板 -->
        <div id="tab-players" class="tab-content max-w-7xl mx-auto">
            <div class="mb-4 flex justify-between items-center bg-white p-3 rounded-xl shadow border-l-4 border-green-500">
                <div><h2 class="text-xl font-bold"><i class="fa-solid fa-users mr-2 text-green-700"></i>極簡角色面板</h2></div>
                <button onclick="addP()" class="px-4 py-2 bg-green-600 text-white rounded shadow font-bold hover:bg-green-700 transition"><i class="fa-solid fa-plus mr-1"></i>新增角色</button>
            </div>
            <div id="players-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-10"></div>
        </div>
    </main>

    <script>
        // =========================================================================
        // 🔴 DATA ZONE (資料區塊) - 請將你的 TXT 陣列資料貼回這裡
        // =========================================================================
        
        // 【範例資料】貼上你的 TXT 陣列後，請將這四個範例陣列覆蓋掉
        let quests = [
  // ==========================================
    // 🌲 凡戴爾的失落礦坑 (主線任務)
    // ==========================================
    { id: "m1", ty: "Main", n: "運送物資到凡戴爾", src: "剛德倫·尋岩者", d: "將裝滿補給品的馬車從絕冬城安全護送到凡戴爾的巴森雜貨店。", obj: ["擊退哥布林伏擊", "將馬車送達雜貨店"], rw: "每人 10 gp" },
    { id: "m2", ty: "Main", n: "營救席爾達", src: "主線劇情", d: "席爾達被耶米克挾持在碎顎據點深處，必須將他活著救出來。", obj: ["潛入碎顎據點", "與耶米克交涉或擊敗他", "護送席爾達回凡戴爾"], rw: "50 gp" },
    { id: "m3", ty: "Main", n: "解決紅印幫的威脅", src: "哈賓 / 席爾達", d: "紅印幫惡棍在鎮上橫行霸道，必須搗毀他們位於特雷森莊園地下的老巢。", obj: ["找到地下室入口", "擊敗首領玻璃杖(伊阿諾)"], rw: "200 gp" },

                        <div class="bg-str rounded border border-red-200"><div class="text-[10px] font-black py-0.5 border-b border-red-200 text-red-900 bg-red-100/50">STR</div><input type="number" value="${p.s.str}" onchange="updateP(${i},'s',this.value,'str')" class="w-full text-center bg-transparent font-bold outline-none py-1.5"><div class="text-[11px] ${gm(p.s.str)>=0?'text-green-700':'text-red-600'} font-black border-t border-red-200 bg-white">${gs(gm(p.s.str))}</div></div>
                        <div class="bg-dex rounded border border-blue-200"><div class="text-[10px] font-black py-0.5 border-b border-blue-200 text-blue-900 bg-blue-100/50">DEX</div><input type="number" value="${p.s.dex}" onchange="updateP(${i},'s',this.value,'dex')" class="w-full text-center bg-transparent font-bold outline-none py-1.5"><div class="text-[11px] ${gm(p.s.dex)>=0?'text-green-700':'text-red-600'} font-black border-t border-blue-200 bg-white">${gs(gm(p.s.dex))}</div></div>
                        <div class="bg-con rounded border border-orange-200"><div class="text-[10px] font-black py-0.5 border-b border-orange-200 text-orange-900 bg-orange-100/50">CON</div><input type="number" value="${p.s.con}" onchange="updateP(${i},'s',this.value,'con')" class="w-full text-center bg-transparent font-bold outline-none py-1.5"><div class="text-[11px] ${gm(p.s.con)>=0?'text-green-700':'text-red-600'} font-black border-t border-orange-200 bg-white">${gs(gm(p.s.con))}</div></div>
                        <div class="bg-int rounded border border-green-200"><div class="text-[10px] font-black py-0.5 border-b border-green-200 text-green-900 bg-green-100/50">INT</div><input type="number" value="${p.s.int}" onchange="updateP(${i},'s',this.value,'int')" class="w-full text-center bg-transparent font-bold outline-none py-1.5"><div class="text-[11px] ${gm(p.s.int)>=0?'text-green-700':'text-red-600'} font-black border-t border-green-200 bg-white">${gs(gm(p.s.int))}</div></div>
                        <div class="bg-wis rounded border border-yellow-300"><div class="text-[10px] font-black py-0.5 border-b border-yellow-300 text-yellow-900 bg-yellow-100/50">WIS</div><input type="number" value="${p.s.wis}" onchange="updateP(${i},'s',this.value,'wis')" class="w-full text-center bg-transparent font-bold outline-none py-1.5"><div class="text-[11px] ${gm(p.s.wis)>=0?'text-green-700':'text-red-600'} font-black border-t border-yellow-300 bg-white">${gs(gm(p.s.wis))}</div></div>
                        <div class="bg-cha rounded border border-purple-200"><div class="text-[10px] font-black py-0.5 border-b border-purple-200 text-purple-900 bg-purple-100/50">CHA</div><input type="number" value="${p.s.cha}" onchange="updateP(${i},'s',this.value,'cha')" class="w-full text-center bg-transparent font-bold outline-none py-1.5"><div class="text-[11px] ${gm(p.s.cha)>=0?'text-green-700':'text-red-600'} font-black border-t border-purple-200 bg-white">${gs(gm(p.s.cha))}</div></div>
                    </div>
                    <div class="flex items-center gap-2 bg-gray-800 text-white p-2 rounded-lg text-sm shadow-inner">
                        <select onchange="updateP(${i},'m',this.value)" class="bg-gray-700 font-bold outline-none text-yellow-400 rounded px-1 py-1 border border-gray-600 text-xs">
                            <option value="str" ${p.m==='str'?'selected':''}>力量</option><option value="dex" ${p.m==='dex'?'selected':''}>敏捷</option><option value="con" ${p.m==='con'?'selected':''}>體質</option><option value="int" ${p.m==='int'?'selected':''}>智力</option><option value="wis" ${p.m==='wis'?'selected':''}>感知</option><option value="cha" ${p.m==='cha'?'selected':''}>魅力</option>
                        </select>
                        <div class="flex-grow text-center text-[10px] font-bold text-gray-400">施法面板</div>
                        <div class="font-black border-l border-gray-600 pl-2 text-sm tracking-wider">DC <span class="text-yellow-400">${dc}</span></div>
                        <div class="font-black border-l border-gray-600 pl-2 text-sm tracking-wider">ATK <span class="text-green-400">${gs(am)}</span></div>
                    </div>
                </div>`;
            }).join(''));
        }

        function rDice(s) {
            const r = Math.floor(Math.random()*s)+1;
            setH('dice-res', `<span class="${s===20&&r===20?'text-green-600':(s===20&&r===1?'text-red-600':'text-gray-800')}">${r}</span>`);
            $('dice-hist').insertAdjacentHTML('afterbegin', `<div class="border-b py-1 text-gray-600">擲出 D${s}: <b class="text-gray-900">${r}</b></div>`);
        }

        let cmbs = [];
        function addCmb() {
            const n = getV('c-name'), i = parseInt(getV('c-init'))||0, hp = parseInt(getV('c-hp'))||10;
            if(n) { cmbs.push({id:Date.now(), n, i, ac:parseInt(getV('c-ac'))||10, hp, f:getV('c-fac')}); $('c-name').value=$('c-init').value=$('c-hp').value=''; renderCmb(); }
        }
        window.modCmb = (id,k,v) => { const c = cmbs.find(x=>x.id===id); if(c){ c[k] = (k==='n')?v:(parseInt(v)||0); renderCmb(); } };
        window.dmgCmb = (id,v) => { const c = cmbs.find(x=>x.id===id); if(c){ c.hp-=(parseInt(v)||0); if(c.hp<0)c.hp=0; renderCmb(); } };
        function renderCmb() {
            cmbs.sort((a,b)=>b.i-a.i);
            setH('combat-list', cmbs.map(c => `<div class="flex items-center justify-between p-1.5 rounded border ${c.f==='p'?'bg-blue-50 border-blue-200':'bg-red-50 border-red-200'} shadow-sm relative group"><button onclick="cmbs=cmbs.filter(x=>x.id!==${c.id});renderCmb()" class="absolute -top-2 -right-2 bg-gray-800 hover:bg-red-600 text-white rounded-full w-5 h-5 text-[10px] z-10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-times"></i></button><div class="flex flex-col items-center justify-center bg-white rounded border px-1 mr-1"><span class="text-[8px] text-gray-400 font-bold uppercase">Init</span><input type="number" value="${c.i}" onchange="modCmb(${c.id},'i',this.value)" class="w-7 text-center bg-transparent text-sm font-black outline-none -mt-1"></div><div class="flex flex-col w-1/3"><span class="text-[8px] text-gray-400 font-bold uppercase ml-1">Name</span><input type="text" value="${c.n}" onchange="modCmb(${c.id},'n',this.value)" class="w-full bg-transparent text-sm font-bold outline-none px-1 text-gray-800 -mt-1 truncate"></div><div class="flex flex-col items-center justify-center bg-white rounded border px-1 mx-1"><span class="text-[8px] text-blue-400 font-bold uppercase">AC</span><input type="number" value="${c.ac}" onchange="modCmb(${c.id},'ac',this.value)" class="w-7 text-center bg-transparent text-blue-800 text-sm font-bold outline-none -mt-1"></div><div class="flex flex-col items-center justify-center bg-white rounded border px-1"><span class="text-[8px] text-red-400 font-bold uppercase">HP</span><input type="number" value="${c.hp}" onchange="modCmb(${c.id},'hp',this.value)" class="w-9 text-center bg-transparent text-red-600 text-sm font-black outline-none -mt-1 ${c.hp<=0?'line-through text-gray-400':''}"></div><div class="flex ml-auto"><input type="number" id="dmg-${c.id}" placeholder="受傷" class="w-10 px-1 border border-r-0 rounded-l text-xs text-center outline-none focus:border-red-500" onkeypress="if(event.key==='Enter'){dmgCmb(${c.id},this.value);this.value='';}"><button onclick="dmgCmb(${c.id},getV('dmg-${c.id}'));$('dmg-${c.id}').value='';" class="bg-red-200 text-red-800 px-2 rounded-r font-black text-xs hover:bg-red-300 transition">-</button></div></div>`).join(''));
        }

        let o = {A:1,B:1,D:5,mA:0,mB:0};
        function initArena() { setH('arena-bets', [1,2,3,4,5].map(i => `<div class="flex items-center gap-1"><input id="ab-n-${i}" placeholder="P${i}" class="border rounded px-1 w-[20%] text-xs text-center font-bold outline-none"><div class="flex w-[40%] gap-0.5"><input type="number" id="ab-g-${i}" placeholder="gp" oninput="calcA()" class="border rounded px-0 py-0.5 w-1/3 text-xs text-center bg-yellow-50 text-yellow-700 outline-none font-bold"><input type="number" id="ab-s-${i}" placeholder="sp" oninput="calcA()" class="border rounded px-0 py-0.5 w-1/3 text-xs text-center bg-gray-50 text-gray-700 outline-none"><input type="number" id="ab-c-${i}" placeholder="cp" oninput="calcA()" class="border rounded px-0 py-0.5 w-1/3 text-xs text-center bg-orange-50 text-orange-700 outline-none"></div><select id="ab-t-${i}" onchange="calcA()" class="border rounded px-1 w-[18%] text-[10px] outline-none font-bold"><option value="A">押紅</option><option value="B">押藍</option><option value="D" class="text-purple-600">押平</option></select><div id="ab-p-${i}" class="w-[22%] text-right text-[10px] font-bold text-green-600 truncate"></div></div>`).join('')); }
        function fM(cp) { if(cp===0)return "0cp"; let res=[]; let g=Math.floor(cp/100),s=Math.floor((cp%100)/10),c=cp%10; if(g>0)res.push(`${g}gp`); if(s>0)res.push(`${s}sp`); if(c>0)res.push(`${c}cp`); return res.join(" "); }
        function genOdds() { const p = (Math.random()*0.4)+0.3; o = {A:(0.95/p).toFixed(1),B:(0.95/(1-p)).toFixed(1),D:(Math.random()*4+4).toFixed(1),mA:Math.round((p-0.5)*10),mB:Math.round((0.5-p)*10)}; setH('od-a', `賠率 ${o.A}x <span class="text-[9px] text-red-400">(${o.mA>0?'+'+o.mA:o.mA})</span>`); setH('od-b', `賠率 ${o.B}x <span class="text-[9px] text-blue-400">(${o.mB>0?'+'+o.mB:o.mB})</span>`); setH('od-d', `平局爆冷: ${o.D}x`); setH('arena-result', '<span class="text-gray-400">擂台已準備就緒，請下注...</span>'); calcA(); }
        window.calcA = () => { [1,2,3,4,5].forEach(i => { const gp=parseInt(getV(`ab-g-${i}`))||0, sp=parseInt(getV(`ab-s-${i}`))||0, cp=parseInt(getV(`ab-c-${i}`))||0, tot=gp*100+sp*10+cp, t=getV(`ab-t-${i}`); setH(`ab-p-${i}`, tot>0 && o.A>1 ? `贏回 ${fM(Math.floor(tot*o[t]))}` : ''); }); };
        function rollArena() {
            if(!o.mA && o.A==1) genOdds(); let wA=0, wB=0, h='<div class="text-xs text-gray-500 mb-2 space-y-1">';
            for(let i=1; i<=3; i++) { let rA = Math.floor(Math.random()*20)+1+o.mA, rB = Math.floor(Math.random()*20)+1+o.mB; if(Math.abs(rA-rB)<=2) h+=`<div class="border-b border-gray-100 pb-1">[R${i}] <span class="text-red-400">${rA}</span> v <span class="text-blue-400">${rB}</span> ➔ <b>平手招架</b></div>`; else if(rA>rB) {wA++;h+=`<div class="border-b border-gray-100 pb-1">[R${i}] <span class="text-red-400 font-bold">${rA}</span> v <span class="text-blue-400">${rB}</span> ➔ <b class="text-red-600">紅方重拳</b></div>`;} else {wB++;h+=`<div class="border-b border-gray-100 pb-1">[R${i}] <span class="text-red-400">${rA}</span> v <span class="text-blue-400 font-bold">${rB}</span> ➔ <b class="text-blue-600">藍方得手</b></div>`;} }
            const m = wA===wB?'D':(wA>wB?'A':'B'); h += `</div><div class="font-black text-sm mb-2 py-1.5 shadow-sm rounded ${m==='D'?'bg-purple-200 text-purple-800':m==='A'?'bg-red-200 text-red-800':'bg-blue-200 text-blue-800'}">${m==='D'?'☠️ 最終平局，莊家通殺':m==='A'?'🏆 紅方獲勝 ('+wA+':'+wB+')':'🏆 藍方獲勝 ('+wB+':'+wA+')'}</div><div class="space-y-1">`;
            [1,2,3,4,5].forEach(i => { const gp=parseInt(getV(`ab-g-${i}`))||0,sp=parseInt(getV(`ab-s-${i}`))||0,cp=parseInt(getV(`ab-c-${i}`))||0,tot=gp*100+sp*10+cp, t=getV(`ab-t-${i}`), n=getV(`ab-n-${i}`)||`P${i}`; if(tot>0) h += `<div class="text-[11px] flex justify-between font-bold px-2 py-1.5 border rounded ${m===t?'text-green-700 bg-green-100':'text-red-600 bg-red-50'}"><span>${n}</span><span>${m===t?`💰 贏回 ${fM(Math.floor(tot*o[t]))}`:`💸 輸掉 ${fM(tot)}`}</span></div>`; });
            setH('arena-result', h + '</div>');
        }

        let dR = 1; const dDCs = [10, 12, 15, 18, 20, 22, 25, 28, 30];
        window.resetDrinking = () => { dR = 1; setH('drink-round', dR); setH('drink-dc', dDCs[0]); setH('drink-res', '<span class="text-gray-400">已重置為第 1 杯。</span>'); $('btn-drink').disabled = false; $('btn-drink').classList.remove('opacity-50'); };
        window.rollDrinking = () => {
            let dc = dDCs[dR - 1] || 30, mod = parseInt(getV('drink-con-mod'))||0, a = $('drink-adv').checked, d = $('drink-dis').checked;
            let r1 = Math.floor(Math.random()*20)+1, r2 = Math.floor(Math.random()*20)+1, fr = r1, str = `D20(${r1})`;
            if(a&&!d) { fr=Math.max(r1,r2); str=`優勢[${r1},${r2}] ➔ <b class="text-green-600">${fr}</b>`; }
            else if(!a&&d) { fr=Math.min(r1,r2); str=`劣勢[${r1},${r2}] ➔ <b class="text-red-600">${fr}</b>`; }
            let tot = fr + mod, h = `<div class="text-xs text-gray-600 mb-1">${str} + 體質(${mod}) = <b class="text-gray-900 text-base">${tot}</b> (DC: ${dc})</div>`;
            if(fr===20) { h+=`<div class="text-green-600 font-black text-lg">🍻 完美吞嚥！(大成功)</div>`; dR++; }
            else if(fr===1) { h+=`<div class="text-red-700 font-black text-lg">🤮 劇烈嘔吐！(大失敗)</div>`; $('btn-drink').disabled=true; $('btn-drink').classList.add('opacity-50'); }
            else if(tot>=dc) { h+=`<div class="text-yellow-600 font-black text-lg">🍺 喉嚨借過！(挑戰成功)</div>`; dR++; }
            else h+=`<div class="text-red-600 font-black text-lg">😵 倒地不起！(挑戰失敗)</div>`;
            setH('drink-res', h); if(dR<=dDCs.length){ setH('drink-round', dR); setH('drink-dc', dDCs[dR-1]); }
        };

        window.rollMining = () => {
            const t = getV('mine-tool'), mod = parseInt(getV('mine-mod'))||0;
            let d20 = Math.floor(Math.random()*20)+1; if(t==='adv') d20 = Math.max(d20, Math.floor(Math.random()*20)+1);
            let tot = d20 + (t==='adv'?0:parseInt(t)) + mod, dr = "", cl = "";
            if(tot<=5){dr="崩塌！受傷 (-1d4 HP)";cl="text-red-600 font-bold";} else if(tot<=10){dr=`銅礦 x ${t==='adv'?6:4}`;cl="text-yellow-700";}
            else if(tot<=15){dr=`銀礦 x ${t==='adv'?6:4}`;cl="text-gray-600 font-bold";} else if(tot<=19){dr=`金礦 x ${t==='adv'?6:4}`;cl="text-yellow-600 font-bold";}
            else if(tot<=22){dr=(t>=3||t==='adv')?`秘銀礦 x ${t==='adv'?6:4}`:"獲得 金礦 x 4 (工具不足)";cl="text-blue-500 font-bold";}
            else {dr=(t==='adv')?"✨ 星月寶石 x 1":"獲得 秘銀礦 x 4 (工具不足)";cl="text-purple-600 font-black text-sm";}
            setH('mine-res', `<div class="text-[10px] text-gray-500 mb-1">D20(${d20}) + 工具/加值 = <b class="text-gray-800 text-sm">${tot}</b></div><div class="${cl}">${dr}</div>`);
        };

        window.rollFishing = () => {
            const t = parseInt(getV('fish-tool'))||0, mod = parseInt(getV('fish-mod'))||0, d20 = Math.floor(Math.random()*20)+1, tot = d20+t+mod;
            let dr="", cl="";
            if(tot<=5){dr="斷線！受傷 (-1d4 HP)";cl="text-red-600 font-bold";} else if(tot<=10){dr=`溪流草魚 x ${Math.floor(Math.random()*4)+1}`;cl="text-gray-700";}
            else if(tot<=15){dr="溪流草魚x2, 銀鱗鱒魚x1";cl="text-blue-500 font-bold";} else if(tot<=22){dr="炫彩錦鯉x1, 盲洞魚x1";cl="text-purple-500 font-bold";}
            else {dr="✨ 妖精之淚 (稀有珍珠)";cl="text-yellow-600 font-black text-sm";}
            setH('fish-res', `<div class="text-[10px] text-blue-400 mb-1">D20(${d20}) + 釣具/加值 = <b class="text-blue-800 text-sm">${tot}</b></div><div class="${cl}">${dr}</div>`);
        };

        // 初始化
        window.onload = () => { 
            initArena(); genOdds(); 
            renderQuests(); renderLocs(); renderSpells(); renderStore(); renderPlayers(); 
        };
    </script>
</body>
</html>
